<!-- Everwatch app icon, small-size artwork for the 16/32 px iconset slots (and their @1x only): thicker arc,
     bigger core, no track/glow/shadows so it survives downsampling. Same grid as logo-app-icon.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs><linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#383a42"/><stop offset="1" stop-color="#131417"/></linearGradient></defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <circle cx="512" cy="512" r="240" fill="none" stroke="#f4f5f8" stroke-width="112" stroke-linecap="round" stroke-dasharray="1050 1508" transform="rotate(-20 512 512)"/>
  <circle cx="512" cy="512" r="128" fill="#ffaf00"/>
</svg>
