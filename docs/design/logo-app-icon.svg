<!-- Everwatch app icon, concept C2 "Vigil": 1024 canvas, macOS icon grid (824 body, 100 margin, ~185 corner).
     Layers (for Icon Composer / make_icon.swift): 1 background tile, 2 ring track, 3 watch arc, 4 amber core + glow.
     Colors: tile #383a42→#131417, arc #ffffff→#c4c8d2, core #ffd978→#ffaf00→#ea8a00 (the attention token). Render sizes >= 64px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#383a42"/><stop offset="1" stop-color="#131417"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c4c8d2"/></linearGradient>
    <radialGradient id="amber" cx=".38" cy=".34" r=".75"><stop offset="0" stop-color="#ffd978"/><stop offset=".55" stop-color="#ffaf00"/><stop offset="1" stop-color="#ea8a00"/></radialGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ffaf00" stop-opacity=".45"/><stop offset="1" stop-color="#ffaf00" stop-opacity="0"/></radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".32"/></filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#drop)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#edge)" stroke-width="3"/>
  <circle cx="512" cy="512" r="248" fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="76"/>
  <circle cx="512" cy="512" r="248" fill="none" stroke="url(#arc)" stroke-width="76" stroke-linecap="round" stroke-dasharray="1100 1558" transform="rotate(-20 512 512)" filter="url(#lift)"/>
  <circle cx="512" cy="512" r="200" fill="url(#glow)"/>
  <circle cx="512" cy="512" r="118" fill="url(#amber)" filter="url(#lift)"/>
</svg>
